name: smartcity-final

x-hadoop: &hadoop
  image: apache/hadoop:3.4.1
  networks: [analytics]
  mem_limit: 1g
  cpus: 1
  environment: &hadoop-env
    CORE-SITE.XML_fs.defaultFS: hdfs://namenode:9000
    HDFS-SITE.XML_dfs.replication: '2'
    HDFS-SITE.XML_dfs.namenode.name.dir: file:///data/name
    HDFS-SITE.XML_dfs.datanode.data.dir: file:///data/data
    HDFS-SITE.XML_dfs.permissions.enabled: 'false'
    HDFS-SITE.XML_dfs.namenode.safemode.min.datanodes: '2'
    HDFS-SITE.XML_dfs.blocksize: '67108864'
    HADOOP_HEAPSIZE_MAX: '512'

services:
  namenode:
    <<: *hadoop
    hostname: namenode
    environment:
      <<: *hadoop-env
      ENSURE_NAMENODE_DIR: /data/name
    command: ['hdfs', 'namenode']
    volumes:
      - namenode:/data
      - ../data:/inputs:ro
      - ./:/jobs:ro
    ports: ['127.0.0.1:19870:9870']
    healthcheck:
      test: ['CMD', 'hdfs', 'dfsadmin', '-safemode', 'get']
      interval: 10s
      timeout: 5s
      retries: 12
  datanode1:
    <<: *hadoop
    hostname: datanode1
    command: ['hdfs', 'datanode']
    volumes: ['datanode1:/data']
  datanode2:
    <<: *hadoop
    hostname: datanode2
    command: ['hdfs', 'datanode']
    volumes: ['datanode2:/data']
  spark-master:
    image: apache/spark:3.5.6
    hostname: spark-master
    command: ['/opt/spark/bin/spark-class', 'org.apache.spark.deploy.master.Master', '--host', 'spark-master']
    networks: [analytics]
    mem_limit: 768m
    ports: ['127.0.0.1:18080:8080']
  spark-worker1: &worker
    image: apache/spark:3.5.6
    user: '${SMARTCITY_UID:-1000}:${SMARTCITY_GID:-1000}'
    environment:
      SPARK_WORKER_DIR: /tmp/spark-work
    command: ['/opt/spark/bin/spark-class', 'org.apache.spark.deploy.worker.Worker', '--cores', '1', '--memory', '1536m', 'spark://spark-master:7077']
    networks: [analytics]
    mem_limit: 2g
    cpus: 1
    volumes:
      - ../data:/outputs
      - type: bind
        source: ./spark-passwd
        target: /etc/passwd
        read_only: true
    depends_on: [spark-master]
  spark-worker2:
    <<: *worker
  spark-driver:
    image: apache/spark:3.5.6
    user: '${SMARTCITY_UID:-1000}:${SMARTCITY_GID:-1000}'
    profiles: [jobs]
    hostname: spark-driver
    command: ['/opt/spark/bin/spark-submit', '--master', 'spark://spark-master:7077', '--driver-memory', '1536m', '--executor-memory', '1g', '--conf', 'spark.cores.max=2', '--conf', 'spark.driver.host=spark-driver', '/jobs/spark_job.py', '--input', 'hdfs://namenode:9000/smartcity/final/observations.jsonl', '--manifest', '/outputs/${SMARTCITY_GENERATION_NAME:-final-20261111}/manifest.json', '--output', '/outputs/${SMARTCITY_SPARK_OUTPUT_NAME:-spark-cluster-20261111}', '--min-records', '${SMARTCITY_MIN_RECORDS:-1000000}']
    networks: [analytics]
    mem_limit: 3g
    volumes:
      - ../data:/outputs
      - ./:/jobs:ro
      - type: bind
        source: ./spark-passwd
        target: /etc/passwd
        read_only: true
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: smartcity
      POSTGRES_PASSWORD: ${SMARTCITY_FINAL_PASSWORD:?Set a local password; never commit it}
      POSTGRES_DB: smartcity_final
    networks: [analytics, local_access]
    ports: ['127.0.0.1:55446:5432']
    volumes: ['postgres:/var/lib/postgresql/data']
    mem_limit: 768m
  mongo1: &mongo
    image: mongo:7.0.16
    hostname: mongo1
    entrypoint: ['/bin/bash', '/bootstrap/mongo-entrypoint.sh']
    command: ['mongod', '--replSet', 'scfinal', '--bind_ip_all', '--keyFile', '/tmp/sc-key']
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${SMARTCITY_FINAL_PASSWORD:?Set a local password}
      MONGO_REPL_KEY: ${SMARTCITY_REPL_KEY:?Generated by final.manage}
    networks: [analytics, local_access]
    mem_limit: 1g
    volumes:
      - mongo1:/data/db
      - ./:/bootstrap:ro
      - ${SMARTCITY_V2_ROOT:-../data}:/inputs:ro
    ports: ['127.0.0.1:57027:27017']
  mongo2:
    <<: *mongo
    hostname: mongo2
    volumes:
      - mongo2:/data/db
      - ./:/bootstrap:ro
      - ${SMARTCITY_V2_ROOT:-../data}:/inputs:ro
    ports: ['127.0.0.1:57028:27017']
  mongo-arbiter:
    <<: *mongo
    hostname: mongo-arbiter
    mem_limit: 384m
    volumes: ['mongo-arbiter:/data/db', './:/bootstrap:ro']
    ports: []

networks:
  analytics:
    internal: true
  local_access:
    driver: bridge
volumes:
  namenode:
  datanode1:
  datanode2:
  postgres:
  mongo1:
  mongo2:
  mongo-arbiter:
