name: validate

on:
  pull_request:
  push:
    branches:
      - main
      - feat/unified-data-contract
      - feat/sprint1-evidence-v2-ci

permissions:
  contents: read

jobs:
  public-validation:
    name: Public repository validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main reference for historical validation
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: >-
            research/datasets/scripts/requirements.lock
      - name: Install Python dependencies
        run: >-
          python -m pip install
          -r research/datasets/scripts/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run public repository validation
        env:
          PYTHON: ${{ env.pythonLocation }}/bin/python
        run: ./scripts/validate_repo.sh
      - name: Validate MongoDB script syntax
        run: node --check research/datasets/scripts/unified_full_mongo.js
      - name: Check diff whitespace
        run: git diff --check
