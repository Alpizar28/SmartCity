[theme]
base = "light"
font = "Vercetti Regular, sans-serif"
codeFont = "monospace"
primaryColor = "#2451c6"
backgroundColor = "#faf9f5"
secondaryBackgroundColor = "#ffffff"
textColor = "#24283a"
linkColor = "#2451c6"
borderColor = "#dfded7"
showWidgetBorder = true

[[theme.fontFaces]]
family = "Vercetti Regular"
url = "app/static/Vercetti-Regular.woff2"
weight = 400
style = "normal"

[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"
showErrorDetails = "none"
